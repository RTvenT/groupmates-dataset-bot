[project]
name = "groupmates-bot"
version = "0.1.0"
description = "Telegram-бот для загрузки фото в папки Google Drive"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31.0",
    "aiohttp-socks>=0.12.0",
    "google-api-python-client>=2.201.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "pydantic-settings>=2.16.1",
]

[project.scripts]
groupmates-bot = "groupmates_bot:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
